name: Build Android APK and AAB (احتساب ناصبیت)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose what to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk_only
          - aab_only
      version_name:
        description: 'App Version Name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'App Version Code (e.g. 1)'
        required: false
        default: '1'

jobs:
  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install npm dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 Build Vite web application
        run: |
          npm run build

      - name: 🤖 Initialize and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already present."
          fi
          echo "Syncing web assets to Android project..."
          npx cap sync android

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📜 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🛡️ Grant execute permission for gradlew
        run: |
          chmod +x android/gradlew

      # -----------------------------------------------------------
      # BUILD APK (Android Application Package)
      # -----------------------------------------------------------
      - name: 📱 Build Android APK
        if: ${{ github.event.inputs.build_type != 'aab_only' }}
        run: |
          cd android
          echo "Building Debug APK (Guaranteed installable)..."
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "Building Release APK..."
          ./gradlew assembleRelease --no-daemon --stacktrace || true
          cd ..

      # -----------------------------------------------------------
      # BUILD AAB (Android App Bundle for Google Play Store)
      # -----------------------------------------------------------
      - name: 📦 Build Android AAB Bundle
        if: ${{ github.event.inputs.build_type != 'apk_only' }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace || true
          cd ..

      # -----------------------------------------------------------
      # COLLECT AND PREPARE ARTIFACTS
      # -----------------------------------------------------------
      - name: 🔑 Collect and Prepare Artifacts
        run: |
          mkdir -p build-artifacts

          # Locate APK (prefer release, fallback to debug)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" build-artifacts/Ihtisab-e-Nasbiyat-v1.0.apk
            echo "APK ready at: build-artifacts/Ihtisab-e-Nasbiyat-v1.0.apk"
          else
            echo "Warning: No APK found!"
          fi

          # Locate AAB
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1)
          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            echo "Found AAB: $AAB_FILE"
            cp "$AAB_FILE" build-artifacts/Ihtisab-e-Nasbiyat-v1.0.aab
            echo "AAB ready at: build-artifacts/Ihtisab-e-Nasbiyat-v1.0.aab"
          else
            echo "Note: No AAB generated (expected if build_type was apk_only)."
          fi

      # -----------------------------------------------------------
      # UPLOAD ARTIFACTS
      # -----------------------------------------------------------
      - name: 📤 Upload APK Artifact (Direct Mobile Install)
        if: ${{ github.event.inputs.build_type != 'aab_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-APK
          path: build-artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload AAB Artifact (Google Play Store Bundle)
        if: ${{ github.event.inputs.build_type != 'apk_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-AAB
          path: build-artifacts/*.aab
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------------------------
      # WORKFLOW SUMMARY
      # -----------------------------------------------------------
      - name: 📝 Output Build Summary
        run: |
          echo "## 🎉 Android Build Complete! (احتساب ناصبیت)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Generated Files:" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File**: \`Ihtisab-e-Nasbiyat-v1.0.apk\` — ڈاؤن لوڈ کر کے کسی بھی اینڈرائیڈ فون پر انسٹال کریں۔" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB File**: \`Ihtisab-e-Nasbiyat-v1.0.aab\` — گوگل پلے کنسول (Google Play Console) پر اپلوڈ کرنے کے لیے تیار۔" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to download:" >> $GITHUB_STEP_SUMMARY
          echo "1. GitHub repository میں **Actions** ٹیب پر جائیں۔" >> $GITHUB_STEP_SUMMARY
          echo "2. اس حالیہ Run پر کلک کریں۔" >> $GITHUB_STEP_SUMMARY
          echo "3. نیچے **Artifacts** سیکشن سے \`Ihtisab-e-Nasbiyat-APK\` یا \`Ihtisab-e-Nasbiyat-AAB\` زپ فائل ڈاؤن لوڈ کر لیں۔" >> $GITHUB_STEP_SUMMARY
